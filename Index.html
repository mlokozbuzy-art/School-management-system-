<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITEGA PRIMARY SCHOOL - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#0b4f6c,#168aad);
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  background:#0b4f6c;
  font-size:35px;
}

h1{
  text-align:center;
  color:#0b4f6c;
  margin-top:15px;
  font-size:24px;
}

.subtitle{
  text-align:center;
  color:#667085;
  margin:8px 0 25px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#0b4f6c;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#message{
  text-align:center;
  margin-top:15px;
  min-height:20px;
}

.footer{
  text-align:center;
  color:#667085;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">🏫</div>

  <h1>KITEGA PRIMARY SCHOOL</h1>

  <p class="subtitle">
    School Management System
  </p>

  <form id="loginForm">

    <label>Username</label>
    <input
      id="username"
      type="text"
      placeholder="Enter teacher username"
      required
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter password"
      required
    >

    <button type="submit">
      LOGIN
    </button>

    <p id="message"></p>

  </form>

  <div class="footer">
    © 2026 KITEGA PRIMARY SCHOOL
  </div>

</div>

<script>

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  message.style.color = "#667085";
  message.textContent = "Logging in...";

  const { data, error } = await db
    .from("teachers")
    .select("*")
    .eq("username", username)
    .eq("password", password)
    .maybeSingle();

  if(error){

    console.error(error);

    message.style.color = "red";
    message.textContent =
      "Database error: " + error.message;

    return;
  }

  if(!data){

    message.style.color = "red";
    message.textContent =
      "Wrong username or password.";

    return;
  }

  localStorage.setItem(
    "teacher",
    JSON.stringify(data)
  );

  message.style.color = "green";
