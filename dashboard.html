<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KITEGA PRIMARY SCHOOL - Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

/* HEADER */

header{
    background:#0b4f6c;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}

.school-name{
    font-size:18px;
    font-weight:bold;
}

.teacher-name{
    font-size:13px;
    opacity:.9;
    margin-top:4px;
}

.logout{
    background:#d92d20;
    color:white;
    border:none;
    padding:9px 14px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:94%;
    max-width:1150px;
    margin:25px auto;
}

.welcome{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.welcome h1{
    color:#0b4f6c;
    margin-bottom:8px;
}

.welcome p{
    color:#667085;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    text-align:center;
}

.card .icon{
    font-size:32px;
    margin-bottom:10px;
}

.card h3{
    margin-bottom:7px;
    color:#0b4f6c;
}

.card p{
    color:#667085;
    font-size:14px;
}
