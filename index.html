<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KITEGA PRIMARY SCHOOL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0b4f6c,#168aad);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.school-icon{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    background:#0b4f6c;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

h1{
    text-align:center;
    color:#0b4f6c;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin:8px 0 25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
    color:#344054;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:none;
    border-radius:9px;
    background:#0b4f6c;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

#message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:13px;
    color:#667085;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="school-icon">🏫</div>

    <h1>KITEGA PRIMARY SCHOOL</h1>

    <p class="subtitle">
        Teacher & Admin Management System
    </p>

    <form id="loginForm">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

        <p id="message"></p>

    </form>

    <div class="footer">
        © 2026 KITEGA PRIMARY SCHOOL
    </div>

</div>

<script>

const SUPABASE_URL =
"https://fifqskyooaxadfnhxlnq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SCL2gLywydIm2NmiQGBWxA_VRnW9DnX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


document
.getElementById("loginForm")
.addEventListener("submit", async function(event){

    event.preventDefault();

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value;

    const message =
    document.getElementById("message");

    message.style.color = "#667085";
    message.textContent = "Checking...";


    const { data, error } =
    await supabaseClient

    .from("teachers")

    .select("*")

    .eq("username", username)

    .eq("password", password)

    .maybeSingle();


    if(error){

        console.error(error);

        message.style.color = "red";

        message.textContent =
        "Database error. Please try again.";

        return;
    }


    if(!data){

        message.style.color = "red";

        message.textContent =
        "Username or password is incorrect.";

        return;
    }


    localStorage.setItem(
        "teacher",
        JSON.stringify(data)
    );


    message.style.color = "green";

    message.textContent =
    "Login successful!";


    setTimeout(function(){

        window.location.href =
        "dashboard.html";

    },800);

});

</script>

</body>
  </html>
